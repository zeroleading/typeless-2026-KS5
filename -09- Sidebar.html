<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Clean typography matching standard reporting tools -->
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        padding: 14px; 
        color: #2d3748; 
        background-color: #fdfdfd;
        margin: 0;
      }
      .form-group { margin-bottom: 16px; }
      .input-label {
        font-weight: 600;
        font-size: 0.85em;
        color: #4a5568;
        display: block;
      }
      input[type="text"] { 
        width: 100%; 
        padding: 8px 10px; 
        box-sizing: border-box; 
        margin-top: 6px; 
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        background-color: #ffffff;
        font-size: 0.9em;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #0081af;
        box-shadow: 0 0 0 2px rgba(0, 129, 175, 0.2);
      }
      .toolbar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
      }
      .refresh-btn {
        background: none;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 0.75em;
        color: #4a5568;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: all 0.15s ease;
      }
      .refresh-btn:hover {
        background-color: #edf2f7;
        border-color: #a0aec0;
        color: #2d3748;
      }
      .filter-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 8px;
      }
      .filter-toggle {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.8em;
        color: #4a5568;
        cursor: pointer;
      }
      .sync-indicator {
        font-size: 0.72em;
        color: #718096;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .sync-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #cbd5e0;
        display: inline-block;
      }
      .sync-dot.active { background-color: #38a169; }
      .sync-dot.loading { background-color: #d69e2e; animation: pulse 1s infinite; }
      @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

      .badge {
        font-size: 0.75em;
        padding: 1px 5px;
        border-radius: 3px;
        font-weight: 600;
        margin-left: 4px;
      }
      .badge-early { background-color: #ebf8ff; color: #0081af; }
      .badge-incomplete { background-color: #fffaf0; color: #dd6b20; }
      .badge-progress {
        background-color: #f8fafc;
        color: #64748b;
        font-size: 0.72em;
        margin-left: auto;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid #e2e8f0;
        white-space: nowrap;
      }
      
      .btn-container { display: flex; gap: 8px; margin-top: 12px; }
      button { 
        flex: 1;
        padding: 9px 12px; 
        cursor: pointer; 
        background-color: #0081af;
        color: #ffffff; 
        border: none; 
        border-radius: 6px; 
        font-size: 0.85em;
        font-weight: 600;
        transition: background-color 0.15s ease;
      }
      button:hover { background-color: #006b91; }
      button:disabled { background-color: #a0aec0; cursor: not-allowed; }
      button.secondary { background-color: #edf2f7; color: #4a5568; }
      button.secondary:hover { background-color: #e2e8f0; }

      .student-list { 
        max-height: 180px; 
        overflow-y: auto; 
        border: 1px solid #e2e8f0; 
        border-radius: 6px; 
        padding: 4px; 
        margin-top: 8px; 
        background: #ffffff; 
      }
      .student-item {
        display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
        font-size: 0.8em; padding: 6px 8px; border-radius: 4px;
        transition: background-color 0.1s ease; cursor: pointer;
        border-left: 3px solid transparent;
      }
      .student-item:hover { background-color: #f7fafc; }
      .student-item.early-app {
        border-left-color: #0081af;
        background-color: #f0f8fb;
      }
      .student-checkbox { accent-color: #0081af; cursor: pointer; }

      /* Sectional Card Previews */
      #outputArea { 
        margin-top: 16px; 
        background: #ffffff; 
        padding: 12px; 
        border: 1px solid #e2e8f0; 
        border-radius: 6px; 
        min-height: 80px;
        font-size: 0.8em;
        line-height: 1.45;
      }
      .preview-card {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .preview-card:last-child { margin-bottom: 0; }
      .preview-title {
        font-size: 0.85em;
        font-weight: 700;
        color: #0081af;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-bottom: 6px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 4px;
      }
      .preview-body {
        white-space: pre-wrap;
        color: #2d3748;
        font-family: inherit;
        font-size: 0.95em;
      }

      /* Progress indicators and spinner animation */
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid rgba(0, 129, 175, 0.2);
        border-radius: 50%;
        border-top-color: #0081af;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .processing-text {
        display: inline-flex;
        align-items: center;
        color: #0081af;
        font-weight: 600;
      }
      .success-link {
        display: inline-block;
        margin-top: 6px;
        color: #0081af;
        font-weight: 600;
        text-decoration: none;
      }
      .success-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="form-group">
      <div class="toolbar-header">
        <label for="searchInput" class="input-label">Search Students</label>
        <button id="refreshBtn" class="refresh-btn" onclick="refreshAllData()" title="Re-synchronise with sheets">
          &#x21bb; Refresh Data
        </button>
      </div>
      <input type="text" id="searchInput" onkeyup="filterList()" placeholder="Search name or reg...">
      
      <div class="filter-group">
        <label class="filter-toggle">
          <input type="checkbox" id="earlyAppFilter" onchange="filterList()">
          Early Apps Only
        </label>
        <label class="filter-toggle">
          <input type="checkbox" id="incompleteFilter" onchange="filterList()">
          Incomplete Only
        </label>
      </div>

      <div class="sync-indicator">
        <span id="syncDot" class="sync-dot"></span>
        <span id="syncStatus">Initialising cohort...</span>
      </div>

      <!-- Dynamic list populated via RPC on load -->
      <div id="studentListContainer" class="student-list">
        <span class="processing-text" style="padding: 8px;"><div class="spinner"></div> Loading cohort...</span>
      </div>
    </div>
    
    <div class="btn-container">
      <button class="secondary" onclick="getPreview()">Preview Sections</button>
      <button onclick="runMerge()">Merge Reference</button>
    </div>
    
    <div id="statusIndicator" style="display: none; margin-top: 12px; text-align: center;"></div>
    <div id="outputArea">Select a student above to inspect their references.</div>

    <script>
      let allStudents = [];
      let cohortCache = null;
      let isPreloadingCache = false;

      // Initialise sidebar and fetch cohort directory on mount
      window.onload = function() {
        loadStudentDirectory(function() {
          preloadCohortData();
        });
      };

      /**
       * Executes on-demand document generation for the selected admission numbers
       * leveraging the client-side cache directly to avoid redundant spreadsheet reads.
       */
      function runMerge() {
        const selected = getSelectedAdnos();
        if (selected.length === 0) {
          setStatus('<span style="color:#e53e3e;">Please select at least one student to merge.</span>', false);
          return;
        }

        // Verify that the in-memory cache has synchronised
        if (!cohortCache) {
          setStatus('<span style="color:#e53e3e;">Data cache is still synchronising. Please wait a moment or click Refresh Data.</span>', false);
          return;
        }

        // Harvest the pre-collated payloads directly from browser memory
        const cachedPayloads = selected
          .map(function(adNo) { return cohortCache[String(adNo)]; })
          .filter(Boolean);

        if (cachedPayloads.length === 0) {
          setStatus('<span style="color:#e53e3e;">Could not locate cached data for the selected students. Please refresh data.</span>', false);
          return;
        }

        setStatus('Merging references from memory to Google Docs...', true);
        
        google.script.run
          .withSuccessHandler(function(res) {
            setStatus('', false);
            if (res.error) {
              document.getElementById('outputArea').innerHTML = '<span style="color:#e53e3e;">' + res.error + '</span>';
              return;
            }

            let html = '<strong style="color:#38a169; font-size: 1.05em;">Generation Successful!</strong><br>' +
                       '<span style="color:#4a5568;">Created ' + res.count + ' document(s).</span><br><br>';

            // Direct document link for single-student merges
            if (res.docUrl) {
              html += '<a href="' + res.docUrl + '" target="_blank" class="success-link">Open Generated Document &rarr;</a><br>';
            }
            // Destination folder link for batch merges
            if (res.folderUrl) {
              html += '<a href="' + res.folderUrl + '" target="_blank" class="success-link">Open Destination Folder &rarr;</a>';
            }
            
            document.getElementById('outputArea').innerHTML = html;
          })
          .withFailureHandler(function(err) {
            setStatus('<span style="color:#e53e3e;">System Error: ' + err.message + '</span>', false);
          })
          .sidebarRunUcasMergeFromCache(cachedPayloads);
      }
    </script>
  </body>
</html>
